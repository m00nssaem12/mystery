// 인물 [이름,역할,알리바이,범인일 때 남는 흔적,범인의 동기] / k=현장단서 / f=결말
const S=[
{pl:["체육관 진열대", "운동장 본부석", "응원석", "교무실 열쇠함", "방송실 영상", "급식실 복도"],t:"사라진 우승 트로피",k2:[["진열대 안내문", "진열대 앞 안내문에는 ‘시상식 전까지 손대지 마세요’라고 적혀 있고, 모서리가 살짝 접혀 있다."], ["선생님 말씀", "체육 선생님은 점심 전에 체육관 불을 끄고 문을 잠갔고, 열쇠 보관함 번호를 아는 학생은 몇 명뿐이라고 했다."]],i2:"이번 운동회는 우리 학교 역사상 가장 접전이었어요. 마지막 달리기까지 점수 차가 단 한 점이었고, 우승 반이 트로피를 받는 순간만 모두가 기다렸어요.",ep:"시상식이 끝난 뒤 범인은 모두에게 사과했고, 친구들은 박수로 받아 줬어요. 우승 반 친구들은 트로피를 함께 들고 사진을 찍었어요.",i:"가을 운동회가 끝난 점심시간. 시상식을 앞두고 체육관 진열대의 우승 트로피가 감쪽같이 사라졌어요. 진열대 유리는 멀쩡하고, 체육관 문도 열쇠 없이는 열 수 없어요. 시상식은 오후 1시예요!",k:[["현장","진열대 유리는 멀쩡하고 체육관 문에는 억지로 연 흔적이 없다."],["시간","트로피는 점심시간 12시 30분~50분 사이에 사라졌다."]],a:["체육관 열쇠 보관함 번호를 알고 있다","보관함 번호를 모른다"],T:"12시 30분~50분",f:"트로피는 {p} 근처 구석에서 무사히 발견됐고, 시상식은 10분 늦게 시작했어요.",c:[
["김하준","반장","교무실","체육 조끼","시상식을 깜짝 이벤트로 꾸미려고 몰래 옮겼다","반 친구들이 믿고 따르는 리더. 운동회 준비를 제일 열심히 했다. 얼마 전 시상 순서 문제로 부반장과 크게 다퉜다."],
["이서연","체육 도우미","운동장 심판석","호루라기","우리 반이 져서 속상한 마음에 숨겼다","달리기를 제일 잘하는 6학년. 이기는 걸 좋아하고 지는 건 정말 싫어한다. 달리기에서 2등을 한 뒤 하루 종일 말이 없었다."],
["박도윤","방송반","방송실","마이크 스펀지","시상 영상에 쓰려고 몰래 빌렸다","조용하지만 영상 편집은 학교 최고. 시상식 영상을 밤새 만들었다. 영상 속 마이크 소리 때문에 선생님께 칭찬받은 적이 있다."],

{b:1,pl:["복도 게시판", "교실 청소함", "분리수거함", "게시판 핀 상자", "청소 당번표", "운동장 뒤편"],t:"사라진 학급 그림",k2:[["빈 자리", "게시판의 그림 자리에는 핀 구멍 네 개와 풀 자국이 깨끗이 남아 있다."], ["청소 시간", "청소 시간에는 교실과 복도 문이 모두 열려 있어서 누구나 오갈 수 있었다."]],i2:"미술 전시회에는 반마다 대표 그림 한 점을 걸어요. 우리 반 대표 그림은 투표로 뽑혔고, 반 친구들이 모두 이름을 한 칸씩 적어 넣은 그림이에요.",ep:"전시회 날 그림은 가장 잘 보이는 자리에 걸렸어요. 사라졌다 돌아온 이야기가 소문나서 관람객이 더 많이 모였어요.",i:"미술 전시회를 하루 앞둔 날, 복도 게시판에 걸어 둔 우리 반 대표 그림이 사라졌어요. 청소 시간이라 교실이 어수선했고, 아무도 그림을 가져간 기억이 없다고 해요. 정말 아무도 모르는 걸까요? 그림을 찾고, 어떻게 사라졌는지 밝혀 주세요.",k:[["현장","게시판 핀이 하나도 부러지지 않고 가지런히 빠져 있다."],["시간","그림은 청소 시간 1시 20분~40분 사이에 사라졌다."]],a:["혼자서 게시판 핀을 뺄 수 있다","혼자서는 핀을 뺄 수 없다"],T:"1시 20분~40분",f:"그림은 누군가의 가방 속에서 둘둘 말린 채 발견됐고, 전시회는 예정대로 열렸어요!",c:[
["김서아","미술 도우미","교실 창가","붓 필통","청소하다 포스터인 줄 알고 말아 가방에 넣었다","그림을 사랑하는 미술 도우미. 대표 그림을 걸 자리를 직접 골랐다. 자기 그림은 아직 한 번도 대표로 뽑힌 적이 없다."],
["이도하","반장","교무실","반장 완장","폐휴지인 줄 알고 모아 두었다","책임감이 강한 반장. 청소 시간에 교실 정리가 가장 급하다고 느꼈다. 전시회 전날이라 교실을 깨끗이 하고 싶었다."],
["박지유","청소 당번","복도","빗자루","떨어진 종이를 줍다가 그림도 버릴 종이인 줄 알고 챙겼다","복도 청소 담당. 바닥에 떨어진 종이를 자주 줍는다. 청소 시간마다 떨어진 종이를 모아 한곳에 둔다."],

["오준호","체육 도우미","체육관","줄넘기","줄넘기를 감싼 종이인 줄 알고 가져갔다","체육 준비물을 책임지는 도우미. 줄넘기가 엉키지 않게 종이로 싸서 들고 다닌다. 종이로 싸 두면 편하다고 늘 말한다."]]},
{pl:["베란다 선반", "과학 준비실", "복도 창가", "베란다 열쇠함", "복도 출입 기록", "화단 앞 벤치"],t:"사라진 새싹 화분",k2:[["관찰 일지", "선반 옆에 걸린 관찰 일지에는 ‘내일 심사’라고 적혀 있고, 오늘 칸에 물 준 표시가 있다."], ["선생님 말씀", "과학 선생님은 점심 전에 베란다 문을 잠갔고, 열쇠가 걸린 곳을 아는 학생은 몇 명뿐이라고 했다."]],i2:"과학의 날 새싹 키우기 대회에서는 반마다 가장 잘 자란 화분 한 개를 내요. 우리 반은 한 달 동안 번갈아 물을 주며 키웠고, 내일 심사를 앞두고 있어요.",ep:"심사 날 새싹은 쑥쑥 자란 모습으로 인기를 끌었어요. 화분 옆에는 ‘옮기기 전에 꼭 말하기’ 푯말이 새로 세워졌어요.",i:"내일은 새싹 키우기 심사날! 베란다 선반에 놓아 둔 우리 반 대표 화분이 점심시간이 끝나고 사라졌어요. 베란다 문은 잠겨 있었고, 선반에는 흙 알갱이만 남았어요. 심사 전에 화분을 찾아야 해요!",k:[["현장","선반에는 물방울 자국과 흙 알갱이만 남았고 화분 받침은 그대로다."],["시간","화분은 점심 직후 12시 50분~1시 10분 사이에 사라졌다."]],a:["베란다 열쇠가 걸린 곳을 알고 있다","열쇠 위치를 모른다"],T:"12시 50분~1시 10분",f:"화분은 {p} 근처에서 무사히 발견됐어요!",c:[

["한지호","반장","교무실","반장 완장","심사 전에 사진을 찍어 두려고 가져갔다","든든한 반장. 사진으로 기록 남기는 걸 좋아한다. 새싹 사진을 모아 친구들에게 보여 준 적이 있다."],
["박나은","미술 도우미","미술실","물감 팔레트","화분에 이름표 장식을 해 주려 했다","꾸미기를 좋아하는 미술 도우미. 화분에 예쁜 이름표를 달고 싶어 했다. 지난주에 화분 이름 후보를 몰래 적어 두었다."],
["최민석","청소 당번","운동장","빗자루","바닥에 흘린 흙을 치우다 화분까지 옮겼다","청소 시간에 흙이 떨어진 걸 못 참는 당번. 베란다 청소도 맡아 왔다. 화분 받침 주변이 지저분하다고 투덜거렸다."],
["강예은","보건 도우미","보건실","손 소독제","새싹이 추울까 봐 따뜻한 곳으로 옮겨 주려 했다","걱정이 많은 보건 도우미. 새싹이 추위에 약하다는 책을 읽었다. 환기하는 날이면 화분부터 살핀다."],
["이도율","방송반","방송실","마이크 스펀지","새싹 소개 방송에 쓰려고 잠깐 옮겼다","방송반 막내. 심사 소개 방송 대본을 쓰고 있었다. 화분을 방송실 책상에 올려 두면 좋겠다고 말했다."]]},
{pl:["운동장 나무 아래", "소풍 준비물 창고", "교실 사물함", "창고 열쇠함", "정문 출입 기록", "화장실 앞 복도"],t:"사라진 보물찾기 상자",k2:[["색종이 조각", "창고 바닥에 빨강·노랑 색종이 조각이 복도 쪽으로 점점이 이어진다."], ["선생님 말씀", "선생님은 창고 열쇠를 열쇠함에 걸어 두었고, 위치를 아는 학생은 몇 명뿐이라고 했다."]],i2:"소풍의 하이라이트는 반 전체가 함께하는 보물찾기예요. 선생님과 도우미들이 보물 쪽지를 직접 접어 상자에 담아 두었고, 쪽지마다 작은 선물이 연결돼 있어요.",ep:"소풍 날 보물찾기는 모두가 한 장 이상 쪽지를 찾아 웃음이 끊이지 않았어요. 상자에는 ‘옮기기 전에 꼭 말하기’ 스티커가 붙었어요.",i:"내일은 기다리던 소풍! 보물찾기에 쓸 쪽지 상자가 소풍 준비물 창고에서 사라졌어요. 창고 문은 잠겨 있었고, 바닥에는 색종이 조각만 떨어져 있어요. 오늘 안에 상자를 찾아야 해요!",k:[["현장","창고 문은 정상으로 잠겨 있고 선반에 상자 크기만큼 빈자리가 남아 있다."],["시간","상자는 5교시 뒤 쉬는 시간 2시 10분~30분 사이에 사라졌다."]],a:["창고 열쇠가 걸린 곳을 알고 있다","열쇠 위치를 모른다"],T:"2시 10분~30분",f:"상자는 {p} 근처에서 무사히 발견됐고, 쪽지는 소풍 날 하나도 빠짐없이 숨겨졌어요!",c:[
["서도현","체육 도우미","운동장","호루라기","보물 위치를 미리 구경하려 했다","호기심 많은 체육 도우미. 쪽지에 뭐가 적혔는지 늘 궁금해했다. 소풍 준비 때 상자를 자꾸 흔들어 본 적이 있다."],
["김나연","반장","교무실","반장 완장","쪽지를 더 잘 숨기려고 미리 정리했다","책임감 강한 반장. 보물 숨길 장소를 노트에 적어 두었다. 쪽지 수가 맞는지 세어 보고 싶다고 말했다."],
["류하준","도서관 도우미","도서관","책갈피","쪽지에 퀴즈를 몰래 더 넣으려 했다","퀴즈 만들기가 취미인 도우미. 보물 쪽지에 수수께끼를 넣자고 제안한 적이 있다. 쪽지 한 장에 이미 퀴즈를 써 두었다."],
["문소민","미술 도우미","미술실","색종이","쪽지 상자를 예쁘게 꾸미려 했다","손재주 좋은 미술 도우미. 상자가 밋밋하다고 생각했다. 색종이로 상자 겉면을 꾸미고 싶다고 말했다."],
["오다온","전학생","체육관","새 도시락 가방","쪽지에 짝꿍 찾기 놀이를 몰래 넣어 친구를 사귀고 싶었다","얼마 전 전학 온 친구. 소풍 짝이 정해지지 않아 걱정이다. 쪽지 짝꿍 찾기 놀이를 하자고 말하려다 말았다."],

{pl:["강당 무대 옆 장비함", "방송실 선반", "음악실", "열쇠걸이", "강당 출입 기록", "급식실 앞 복도"],t:"사라진 합창 마이크",k2:[["반짝이 가루", "무대 옆 바닥에 반짝이 가루가 복도 쪽으로 이어져 있다."], ["선생님 말씀", "음악 선생님은 점심 전에 장비함을 잠갔고, 열쇠가 걸린 곳을 아는 학생은 몇 명뿐이라고 했다."]],i2:"합창 대회는 반 전체가 한 달 동안 연습한 무대예요. 독창 파트를 맡은 친구가 무선 마이크로 노래하기로 해서, 마이크가 없으면 가장 중요한 부분을 부를 수 없어요.",ep:"합창은 박수 속에 끝났어요. 독창 친구는 떨리는 목소리로 노래를 마쳤고, 반 친구들은 끝나고 함께 사진을 찍었어요.",i:"오늘은 합창 대회! 그런데 독창 파트에 쓸 무선 마이크가 강당 무대 옆 장비함에서 사라졌어요. 장비함 자물쇠는 멀쩡하고, 바닥에는 반짝이 가루가 떨어져 있어요. 대회가 시작되기 전에 마이크를 찾아야 해요!",k:[["현장","장비함 자물쇠는 정상이고 안에서 마이크 자리만 비어 있다."],["시간","마이크는 점심시간 12시 40분~1시 사이에 사라졌다."]],a:["장비함 열쇠가 걸린 곳을 알고 있다","열쇠 위치를 모른다"],T:"12시 40분~1시",f:"마이크는 {p} 근처에서 무사히 발견됐고, 합창 대회는 10분 늦게 시작했어요!",c:[
["신하율","음악 도우미","음악실","악보 클립","마이크 소리를 미리 점검하려 했다","음악을 사랑하는 도우미. 마이크 소리가 울린다고 걱정했다. 독창 파트 연습 때 소리 점검을 꼭 해 달라고 부탁했다."],
["임도연","독창 담당","강당","물병","떨려서 혼자 마이크 연습을 하려 했다","합창 독창 파트를 맡은 친구. 무대가 두려워서 연습을 더 하고 싶어 한다. 연습할 때 자꾸 목이 잠긴다고 말했다."],
["정시안","방송반","방송실","마이크 줄","마이크 음량 테스트를 하려 했다","방송 장비를 제일 잘 다루는 친구. 장비가 흐트러져 있으면 정리해야 직성이 풀린다. 마이크 배터리가 약할까 봐 걱정했다."],

const X=[
{i:"가을 운동회가 끝난 점심시간. 시상식을 앞두고 체육관 진열대의 우승 트로피가 감쪽같이 사라졌어요. 진열대 유리는 멀쩡하고, 체육관 문도 열쇠 없이는 열 수 없어요. 점심 전에 체육 선생님이 직접 불을 끄고 문을 잠갔으니, 그 뒤에 들어간 사람은 열쇠 보관함 번호를 알고 있었다는 뜻이에요. 시상식은 오후 1시, 시간이 많지 않아요!",

tl:["오전 : 마지막 경기가 끝나고 트로피가 체육관 진열대에 올라간다.","12:00 : 점심시간이 시작되고 체육 선생님이 체육관 불을 끄고 문을 잠근다.","12:30~12:50 : 이 사이에 트로피가 사라진다.","12:55 : 도우미가 빈 진열대를 발견하고 선생님께 알린다."],

pe:["운동회 날 아침에도 제일 먼저 교실에 와서 준비물을 점검했다.","달리기 기록을 적은 작은 수첩을 늘 주머니에 넣고 다닌다.","점심시간마다 방송실에서 혼자 도시락을 먹는 날이 많다.","점심시간에는 체육관 근처 복도를 한 바퀴 도는 습관이 있다.","응원 구호를 적은 종이를 접어 응원 방울에 달고 다닌다.","작은 수첩에 반 일정을 시간별로 적어 두고 확인한다."]},
{i:"내일은 학예회! 그런데 연극 팀이 쓰는 호랑이 탈이 보관함에서 사라졌어요. 자물쇠는 부서지지 않았고, 바닥에는 마르지 않은 파란 물감과 하얀 솜가루가 점점이 떨어져 있어요. 물감이 아직 마르지 않았다는 건 사건이 얼마 전에 일어났다는 뜻이에요. 내일 아침까지 탈을 찾아야 해요.",

ep:"연극은 무사히 막을 올렸어요. 탈은 새 솜을 넣고 귀를 고쳐 훨씬 멋져졌고, 관객은 호랑이 등장 장면에서 큰 박수를 쳤어요. 보관함에는 ‘탈을 꺼낼 땐 꼭 연극 팀에게 말하기’ 쪽지가 붙었고, 범인도 무대 뒤에서 소품을 도왔어요.",
tl:["12:30 : 마지막 연습이 끝나고 탈이 보관함에 들어간다.","12:40~1:00 : 이 사이에 탈이 사라진다. 바닥의 물감은 아직 마르지 않았다.","1:10 : 연극 팀장이 빈 보관함을 발견한다.","1:20 : 복도 쪽으로 솜가루 자국이 이어진다는 걸 알게 된다."],

q:["보관함 번호를 아는 사람은 누구인가요? 물감이 마르지 않았다는 사실로 사건 시간대를 짐작해 보세요.","솜가루가 이어진 방향과 각자의 알리바이를 비교해 보세요. 그 장소에 있었다고 말한 사람을 본 사람이 있나요?"],
pe:["대본 귀퉁이에 호랑이 대사를 색연필로 칠해 두었다.","손끝에 늘 물감이 조금 묻어 있다.","점심시간에는 도서관 창가 자리를 좋아한다.","혼자 조용히 걷다가 복도 끝에서 멈춰 서는 일이 많다.","카메라 줄을 목에 걸고 다니며 친구들 표정을 먼저 찾는다.","리코더 소리가 복도까지 들릴 때가 많다."]},
{i:"내일은 과학의 날 발표 대회! 발표 자료가 든 USB가 과학실 책상 위 필통에서 사라졌어요. 필통만 덩그러니 남아 있고, 백업 파일은 없어요. 과학실 문은 열쇠로만 열리니, 열쇠가 걸린 곳을 아는 사람이 들어갔을 수 있어요. 누가, 왜 가져갔을까요?",

pe:["발표 연습을 하다 목이 마르면 늘 물병부터 찾는다.","손가락으로 책상을 두드리며 슬라이드 순서를 중얼거린다.","점심시간에는 운동장에서 친구들과 공놀이를 한다.","교무실에 자주 불려 가서 선생님 심부름을 한다.","책을 읽다가 시간 가는 줄 모르는 날이 많다.","손에 물감 자국이 조금 남아 있는 날이 많다."]},
{i:"3교시가 끝나자 급식실 냉장고에 두었던 우리 반 생일 푸딩 상자가 사라졌어요. 냉장고 문은 닫혀 있고 바닥에는 우유 방울만 떨어져 있어요. 급식실 뒷문은 허락받은 사람만 드나들 수 있어서, 냉장고 쪽에 간 사람이 누구인지가 중요해요. 점심 전에 푸딩을 찾아 생일 파티를 열어야 해요!",
i2:"오늘은 우리 반 친구의 생일이에요. 반 전체가 비밀로 푸딩을 주문했고, 점심시간에 깜짝 파티를 열기로 했어요. 생일 주인공만 모르는 비밀이라, 푸딩이 없어지면 파티도 함께 사라져요. 푸딩 상자에는 반 친구들이 쓴 쪽지도 붙어 있어요.",
ep:"푸딩은 점심시간에 반 전체가 나눠 먹었어요. 생일 주인공은 깜짝 파티에 눈물이 났고, 모두가 한 소절씩 생일 축하 노래를 불렀어요. 범인도 직접 쓴 사과 카드를 건넸고, 급식 아주머니는 다음부터는 미리 말해 달라고 웃으며 말씀하셨어요.",
tl:["9:00 : 푸딩 상자가 급식실 냉장고 가운데 칸에 들어간다.","10:40~11:20 : 3교시 동안 푸딩이 사라진다.","11:30 : 급식 도우미가 빈 칸을 발견한다.","11:40 : 선생님이 점심 전까지 찾아보자고 한다."],
k3:[["쪽지 조각","냉장고 아래 틈에 ‘생일 축하해’라고 적힌 쪽지 한 귀퉁이가 끼어 있다. 상자에 붙어 있던 쪽지가 뜯겨 나온 것 같다."],["뒷문 매트","급식실 뒷문 앞 매트에 우유가 묻은 작은 발자국이 남아 있다."]],
how:"범인 {c}의 행동은 이랬어요. 3교시 동안 조리실이 바쁜 틈에 뒷문으로 들어가 냉장고에서 푸딩 상자를 꺼냈어요. 상자를 옮기는 동안 우유가 떨어졌고 쪽지 한 귀퉁이도 뜯겨 나갔어요. 상자는 {p} 근처에 숨겨졌고, 파티가 열릴 때까지 아무도 열어 보지 못했어요.",
q:["뒷문으로 드나들 수 있는 사람은 누구인가요? 3교시 동안 조리실 근처에서 본 사람이 있나요?","우유 방울과 발자국이 어디서 어디로 이어졌는지 모아 보세요. 그 길목에 있었다고 말한 사람은 누구인가요?"],
pe:["급식 시간표를 외워서 친구들에게 알려 준다.","책상 서랍에 작은 과자 한 봉지를 넣어 두는 날이 많다.","아침 방송에서 매일 날씨를 읽는다.","생일 선물 목록을 수첩에 적어 둔다.","급식 알레르기 표를 늘 들고 다닌다.","색연필 세트를 가방에 넣고 다닌다."]},
{i:"독서 골든벨이 열리는 날. 인기 동화책의 마지막 한 권이 반납함에서 사라졌어요. 반납함은 열쇠로만 열 수 있고, 서가 사이에는 쪽지 한 장이 끼어 있어요. 열쇠 대장에 이름을 적지 않고 반납함을 열 수 있는 사람은 많지 않아요. 퀴즈가 시작되기 전에 책을 되찾아야 해요!",
i2:"독서 골든벨 우승 상품은 문화상품권이에요. 마지막 책은 퀴즈 문제가 가장 많이 나오는 인기 동화라서, 모두가 한 번이라도 읽고 싶어 했어요. 이 책은 도서관에 한 권밖에 남지 않아 대출 줄이 길었고, 오늘 아침에는 대기 명단까지 만들어졌어요.",
ep:"골든벨은 시작 5분 전에 책이 돌아와 무사히 열렸어요. 도서관에는 ‘빌릴 땐 꼭 대출 기록’ 안내문이 새로 붙었답니다. 범인은 사서 선생님께 사과하고, 한 주 동안 도서관 정리를 돕기로 했어요.",
tl:["아침 : 마지막 책이 반납함에 들어온다. 대기 명단에는 여러 이름이 있다.","12:10~12:30 : 이 사이에 책이 사라진다.","12:40 : 도우미가 서가 사이의 쪽지를 발견한다.","1:00 : 골든벨 시작 5분 전. 책을 찾아야 한다."],
k3:[["대기 명단","도서관 카운터의 대기 명단에는 이름 세 개가 적혀 있고, 그중 하나는 연필로 급하게 지워져 있다."],["열쇠 대장","열쇠 대장에는 오늘 점심 칸이 비어 있고, 마지막으로 쓴 사람의 이름은 어제 날짜다."]],
how:"범인 {c}의 행동은 이랬어요. 점심시간 도서관이 한산한 틈에 열쇠 대장에 이름을 적지 않고 반납함을 열어 마지막 책을 꺼냈어요. 그리고 서가 사이에 쪽지를 끼워 둔 뒤, 책을 {p} 근처로 옮겼어요. ‘내일까지 꼭 돌려놓기’라는 쪽지가 범인의 마음을 그대로 보여 줬어요.",
q:["열쇠 대장에 이름을 적지 않고 반납함을 열 수 있는 사람은 누구일까요?","쪽지의 글씨와 문장, 대기 명단을 보고 어떤 사람이 책을 가져갔을지 생각해 보세요."],
pe:["도서관 카운터 뒤쪽에 자기 자리가 따로 있다.","책 모서리를 접는 걸 싫어해서 책갈피를 늘 가지고 다닌다.","책 표지를 보며 줄거리를 상상하는 걸 좋아한다.","쉬는 시간에도 연필을 깎는 일이 많다.","청소 시간이면 가장 먼저 걸레를 챙긴다.","방송 대본을 늘 연필로 먼저 쓴다."]},
{i:"미술 전시회를 하루 앞둔 날, 복도 게시판에 걸어 둔 우리 반 대표 그림이 사라졌어요. 청소 시간이라 교실이 어수선했고, 아무도 그림을 가져간 기억이 없다고 해요. 게시판 핀은 부러지지 않고 가지런히 빠져 있어서, 누군가 조심스럽게 떼어 낸 것 같아요. 정말 아무도 모르는 걸까요? 그림을 찾고, 어떻게 사라졌는지 밝혀 주세요.",
i2:"미술 전시회에는 반마다 대표 그림 한 점을 걸어요. 우리 반 대표 그림은 투표로 뽑혔고, 반 친구들이 모두 이름을 한 칸씩 적어 넣은 그림이에요. 그림은 말아 두면 접힌 자국이 생기기 쉬워서 하루 전에 게시판에 걸어 두었어요. 청소 시간에는 문이 모두 열려 있어서 누구나 복도를 오갈 수 있어요.",
ep:"전시회 날 그림은 가장 잘 보이는 자리에 걸렸어요. 사라졌다 돌아온 이야기가 소문나서 관람객이 더 많이 모였어요. 그림 아래에는 ‘함께 그린 우리 반 그림’이라는 작은 안내문이 붙었어요.",
tl:["1:00 : 청소 시간이 시작된다. 교실과 복도 문이 모두 열린다.","1:20~1:40 : 이 사이에 그림이 사라진다.","1:50 : 청소가 끝나고 게시판의 빈 자리가 발견된다.","2:00 : 아무도 그림을 가져간 기억이 없다고 말한다."],
k3:[["핀 상자","게시판 핀 상자에는 핀 네 개가 한꺼번에 들어 있다. 누군가 뺀 핀을 상자에 가지런히 돌려놓은 것 같다."],["풀 자국","게시판의 풀 자국은 그림 가장자리 모양 그대로 깨끗하다. 그림은 구겨지지 않고 한 번에 떼어진 것 같다."]],
how:"이번 사건은 범인 {c} 본인도 자기가 범인인 줄 몰랐어요. 청소 시간에 정리하는 일에 집중하다가, 게시판의 그림을 다른 종이로 착각하고 핀을 하나씩 가지런히 뺐어요. 그림은 둘둘 말려 가방 속에 들어갔고, 가방은 그대로 옆에 놓여 있었어요.",
q:["청소 시간에 게시판 근처에서 종이를 만진 사람은 누구인가요? ‘모르겠다’는 말이 정말일까요?","핀이 가지런히 빠진 이유를 생각해 보세요. 일부러 한 걸까요, 아니면 무엇을 다른 것으로 착각한 걸까요?"],
pe:["그림을 그릴 때 늘 같은 자리에 앉는다.","교실 정리 순서를 직접 정해 두고 있다.","복도 청소를 하며 게시판 앞을 자주 지난다.","새 학교의 복도 길을 아직 외우는 중이다.","과학 실험 노트를 늘 가방에 넣고 다닌다.","체육 시간이 끝나면 줄넘기부터 정리한다."]},
{i:"내일은 새싹 키우기 심사날! 베란다 선반에 놓아 둔 우리 반 대표 화분이 점심시간이 끝나고 사라졌어요. 베란다 문은 잠겨 있었고, 선반에는 흙 알갱이만 남았어요. 문을 열려면 열쇠가 걸린 곳을 알아야 해요. 심사 전에 화분을 찾아야 해요!",
i2:"과학의 날 새싹 키우기 대회에서는 반마다 가장 잘 자란 화분 한 개를 내요. 우리 반은 한 달 동안 번갈아 물을 주며 키웠고, 새싹은 손가락 두 마디만큼 자랐어요. 심사 전날인 오늘은 마지막으로 키를 재고 관찰 일지에 기록하는 날이었어요. 화분이 사라지면 한 달 동안의 기록도 함께 사라져요.",
ep:"심사 날 새싹은 쑥쑥 자란 모습으로 인기를 끌었어요. 화분 옆에는 ‘옮기기 전에 꼭 말하기’ 푯말이 새로 세워졌어요. 범인은 새싹에 물을 주는 당번이 되었고, 심사위원 선생님은 한 달 동안의 기록에 큰 박수를 쳐 주셨어요.",
tl:["12:00 : 점심시간 전, 마지막으로 물을 주고 베란다 문을 잠근다.","12:50~1:10 : 이 사이에 화분이 사라진다.","1:20 : 청소 당번이 빈 선반을 발견한다.","1:30 : 관찰 일지의 오늘 칸에 물 준 표시가 있는 것을 확인한다."],
k3:[["물 자국","베란다 바닥에 화분 바닥 구멍에서 흘러내린 물이 복도 쪽으로 점점이 이어져 있다."],["받침 자국","선반 위 화분 받침에는 둥근 흙 자국이 선명하다. 화분을 조심스럽게 들어 올린 흔적이다."]],
how:"범인 {c}의 행동은 이랬어요. 점심시간에 베란다 열쇠가 걸린 곳에서 열쇠를 꺼내 문을 열고, 화분을 두 손으로 조심스럽게 들어 올렸어요. 물이 복도 쪽으로 흘러 자국이 남았고, 화분은 {p} 근처로 옮겨졌어요.",
q:["베란다 열쇠가 걸린 곳을 아는 사람은 누구인가요? 물 자국이 이어진 방향에 있었다는 사람은 누구인가요?","화분이 사라진 시간 앞뒤의 행적을 비교해 보세요. ‘여러 명과 함께’ 있었다는 말을 확인해 줄 사람이 있나요?"],
pe:["매일 아침 제일 먼저 새싹부터 들여다본다.","교실 사진 찍는 걸 좋아해서 사진 담당을 자주 맡는다.","작은 스티커를 모아 필통에 붙여 둔다.","청소 순서표를 직접 그려 붙여 두었다.","교실 온도가 낮은 날이면 창문부터 확인한다.","점심시간에 방송실에서 음악을 틀어 준다."]},
{i:"내일은 기다리던 소풍! 보물찾기에 쓸 쪽지 상자가 소풍 준비물 창고에서 사라졌어요. 창고 문은 잠겨 있었고, 바닥에는 색종이 조각만 떨어져 있어요. 창고 열쇠가 걸린 곳을 아는 사람만 들어갈 수 있으니, 누가 열쇠를 썼는지가 중요해요. 오늘 안에 상자를 찾아야 해요!",
i2:"소풍의 하이라이트는 반 전체가 함께하는 보물찾기예요. 선생님과 도우미들이 보물 쪽지를 직접 접어 상자에 담아 두었고, 쪽지마다 작은 선물이 연결돼 있어요. 쪽지는 숨길 장소가 모두 정해져 있어서, 상자가 없으면 내일 아침에 처음부터 다시 만들어야 해요.",
ep:"소풍 날 보물찾기는 모두가 한 장 이상 쪽지를 찾아 웃음이 끊이지 않았어요. 상자에는 ‘옮기기 전에 꼭 말하기’ 스티커가 붙었어요. 범인은 쪽지 숨기는 일을 도왔고, 범인이 숨긴 쪽지가 가장 먼저 발견돼 모두가 웃었어요.",
tl:["1:50 : 선생님이 소풍 준비물을 창고에 넣고 문을 잠근다.","2:10~2:30 : 쉬는 시간에 상자가 사라진다.","2:40 : 도우미가 빈 선반을 발견한다.","3:00 : 선생님이 창고 열쇠는 열쇠함에서만 꺼낼 수 있다고 알려 준다."],
k3:[["상자 모서리","선반 위에는 상자 모서리가 눌린 자국이 남아 있고, 선반 가장자리의 먼지가 한쪽으로 쓸려 있다."],["색종이 방향","색종이 조각은 창고 문에서 복도 쪽으로 이어지다가 복도 중간에서 끊긴다."]],
how:"범인 {c}의 행동은 이랬어요. 쉬는 시간에 복도가 시끄러운 틈을 타 열쇠함에서 창고 열쇠를 꺼내 문을 열고, 선반 위 쪽지 상자를 들고 나왔어요. 색종이 조각이 복도에 떨어졌고, 상자는 {p} 근처에 숨겨졌어요.",
q:["창고 열쇠가 걸린 곳을 아는 사람은 누구인가요? 색종이 조각이 끊긴 곳에서 누군가를 봤나요?","쉬는 시간 2시 10분~30분에 정말 다른 사람과 함께 있었는지 서로 확인해 보세요."],
pe:["소풍 전날이면 가방을 두세 번 다시 싼다.","학급 일정표를 직접 만들어 칠판 옆에 붙였다.","수수께끼 책을 도서관에서 자주 빌려 본다.","색종이를 접어 작은 동물을 만든다.","새 학교 지도를 접어 주머니에 넣고 다닌다.","소풍 준비물 목록을 꼼꼼히 확인하는 편이다."]},
{i:"오늘은 합창 대회! 그런데 독창 파트에 쓸 무선 마이크가 강당 무대 옆 장비함에서 사라졌어요. 장비함 자물쇠는 멀쩡하고, 바닥에는 반짝이 가루가 떨어져 있어요. 장비함 열쇠가 열쇠걸이 어디에 걸려 있는지 아는 사람만 장비함을 열 수 있어요. 대회가 시작되기 전에 마이크를 찾아야 해요!",
